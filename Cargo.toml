[package]
name = "treetop-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.93.1"
autobenches = false
license = "MIT"
description = "Core library for Treetop, a Cedar policy engine implementation."
documentation = "https://docs.rs/treetop-core/latest/treetop_core/"
repository = "https://github.com/treetop-policy-engine/treetop-core"
readme = "README.md"
keywords = ["cedar", "policy", "authorization", "access-control"]
categories = ["authentication"]
include = [
    "/src/**",
    "/benches/**",
    "/docs/**",
    "/examples/**",
    "/testdata/**",
    "/Cargo.lock",
    "/Cargo.toml",
    "/Changelog.md",
    "/LICENSE",
    "/README.md",
    "/RELEASING.md",
    "/build.rs",
    "/build_support.rs",
]

[dependencies]
arc-swap = "1.9.2"
# Keep this exact: `BuildInfo::cedar_version` reports the directly linked version.
cedar-policy = "=4.13.0"
humantime = "2.4.0"
sha2 = "0.11.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
utoipa = "5.5.0"

[features]
default = []
# Enable metrics collection (via MetricsSink) and tracing spans for observability.
# Consumers can integrate with OpenTelemetry, Prometheus, or any metrics backend.
observability = []
# Expose shared fixtures and thin wrappers around crate-private hot paths for
# benchmark targets.
# This feature is not intended for production consumers.
bench-internal = []

[dev-dependencies]
criterion = "0.8.2"
gungraun = "0.19.4"
insta = { version = "1.48.0", features = ["json", "serde", "redactions"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
serial_test = "4.0.1"
yare = "3.0.0"

[[bench]]
name = "bench_iai_label_registry"
harness = false

[[bench]]
name = "label_registry_criterion"
harness = false

[[example]]
name = "prometheus_sink"
required-features = ["observability"]

[[example]]
name = "opentelemetry_tracing"
required-features = ["observability"]

[[test]]
name = "policy_scale"
path = "tests/policy_scale.rs"
required-features = ["bench-internal"]

[[bench]]
name = "evaluate_criterion_baseline"
harness = false

[[bench]]
name = "evaluate_criterion_sessions"
harness = false

[[bench]]
name = "evaluate_criterion_groups"
harness = false

[[bench]]
name = "evaluate_criterion_labels"
harness = false

[[bench]]
name = "evaluate_criterion_namespaced"
harness = false

[[bench]]
name = "evaluate_criterion_policy_stores"
harness = false

[[bench]]
name = "policy_scale_criterion"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "policy_scale_probe"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "policy_concurrency_probe"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "policy_memory_probe"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "permit_metadata_criterion"
harness = false

[[bench]]
name = "bench_iai_permit_metadata"
harness = false

# Keep the legacy `iai` target names so v3 can pair Gungraun head results with
# existing IAI-Callgrind base results and retain benchmark history.
[[bench]]
name = "evaluate_iai_baseline"
harness = false

[[bench]]
name = "evaluate_iai_sessions"
harness = false

[[bench]]
name = "evaluate_iai_groups"
harness = false

[[bench]]
name = "evaluate_iai_labels"
harness = false

[[bench]]
name = "evaluate_iai_namespaced"
harness = false

[[bench]]
name = "evaluate_iai_policy_stores"
harness = false

[[bench]]
name = "bench_iai_loader"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "bench_iai_policy_match"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "bench_iai_query"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "bench_iai_entity_uid"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "bench_iai_attr_value"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "bench_iai_metrics"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "bench_iai_metrics_evaluation"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "bench_iai_timers"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "bench_iai_label_target"
harness = false

[[bench]]
name = "label_target_criterion"
harness = false
