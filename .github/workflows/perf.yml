name: Perf

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    name: PR Bench
    # Immutable commit behind the v1.0.0 tag.
    uses: terjekv/rust-pr-bench/.github/workflows/rust-pr-bench.yml@d24fdffb623edf81ef59100c4d5ab6d730081025
    with:
      action_ref: 0343a98c94e04d326c5fbfea753fad9934eee7be
      backend: all
      benchmarks_json: >-
        [
          {"name":"evaluate_criterion_baseline","bench":"evaluate_criterion_baseline","backend":"criterion"},
          {"name":"evaluate_criterion_sessions","bench":"evaluate_criterion_sessions","backend":"criterion"},
          {"name":"evaluate_criterion_groups","bench":"evaluate_criterion_groups","backend":"criterion"},
          {"name":"evaluate_criterion_labels","bench":"evaluate_criterion_labels","backend":"criterion"},
          {"name":"evaluate_criterion_namespaced","bench":"evaluate_criterion_namespaced","backend":"criterion"},
          {"name":"evaluate_criterion_policy_stores","bench":"evaluate_criterion_policy_stores","backend":"criterion"},
          {"name":"evaluate_iai_baseline","bench":"evaluate_iai_baseline","backend":"gungraun"},
          {"name":"evaluate_iai_sessions","bench":"evaluate_iai_sessions","backend":"gungraun"},
          {"name":"evaluate_iai_groups","bench":"evaluate_iai_groups","backend":"gungraun"},
          {"name":"evaluate_iai_labels","bench":"evaluate_iai_labels","backend":"gungraun"},
          {"name":"evaluate_iai_namespaced","bench":"evaluate_iai_namespaced","backend":"gungraun"},
          {"name":"evaluate_iai_policy_stores","bench":"evaluate_iai_policy_stores","backend":"gungraun"},
          {"name":"bench_iai_loader","bench":"bench_iai_loader","backend":"gungraun"},
          {"name":"bench_iai_policy_match","bench":"bench_iai_policy_match","backend":"gungraun"},
          {"name":"bench_iai_query","bench":"bench_iai_query","backend":"gungraun"},
          {"name":"bench_iai_entity_uid","bench":"bench_iai_entity_uid","backend":"gungraun"},
          {"name":"bench_iai_attr_value","bench":"bench_iai_attr_value","backend":"gungraun"},
          {"name":"bench_iai_metrics","bench":"bench_iai_metrics","backend":"gungraun"},
          {"name":"bench_iai_metrics_evaluation","bench":"bench_iai_metrics_evaluation","backend":"gungraun"},
          {"name":"bench_iai_timers","bench":"bench_iai_timers","backend":"gungraun"},
          {"name":"bench_iai_label_target","bench":"bench_iai_label_target","backend":"gungraun"},
          {"name":"label_target_criterion","bench":"label_target_criterion","backend":"criterion"},
          {"name":"bench_iai_label_registry","bench":"bench_iai_label_registry","backend":"gungraun"},
          {"name":"label_registry_criterion","bench":"label_registry_criterion","backend":"criterion"}
        ]
      feature_sets_json: >-
        [
          {"name":"no-obs","features":"bench-internal"},
          {"name":"obs","features":"bench-internal,observability"}
        ]
      criterion_statistic: median
      regression_threshold_pct_gungraun: 8
      regression_threshold_pct_criterion: 10
      fail_on_regression: true
