name: Policy Scale

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      policy_count:
        description: Number of generated Cedar policies
        required: true
        default: "100000"
        type: choice
        options:
          - "1000"
          - "10000"
          - "100000"
          - "250000"

permissions:
  contents: read

concurrency:
  group: policy-scale-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  scale:
    name: ${{ matrix.policy_count }} policies
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        policy_count: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{0}]', inputs.policy_count) || '[1000,10000,100000]') }}
    env:
      TREETOP_SCALE_POLICY_COUNT: ${{ matrix.policy_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.93.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Compile scale tools
        run: |
          cargo test --release --locked --all-features --test policy_scale --no-run
          cargo bench --locked --features bench-internal --bench policy_scale_probe --no-run

      - name: Exercise scale corpus
        run: >-
          cargo test --release --locked --all-features
          --test policy_scale configured_policy_scale_loads_evaluates_lists_and_reloads
          -- --ignored --exact --nocapture

      - name: Probe CPU-sensitive latency and memory
        run: |
          /usr/bin/time -v -o policy-scale-resources.txt \
            cargo bench --locked --features bench-internal --bench policy_scale_probe \
            | tee policy-scale-report.md
          {
            cat policy-scale-report.md
            echo
            echo "### Whole-process resources"
            echo
            echo '```text'
            sed -n \
              -e '/User time/p' \
              -e '/System time/p' \
              -e '/Percent of CPU/p' \
              -e '/Elapsed (wall clock) time/p' \
              -e '/Maximum resident set size/p' \
              -e '/Swaps/p' \
              policy-scale-resources.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark scale corpus
        run: >-
          cargo bench --locked --features bench-internal
          --bench policy_scale_criterion -- --noplot
