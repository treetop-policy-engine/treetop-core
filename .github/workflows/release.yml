name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt

      - name: Verify tag and release commit
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "treetop-core") | .version')"
          expected_tag="v${version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}." >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          release_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "Release commit ${release_commit} is not on origin/main." >&2
            exit 1
          fi

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Build documentation
        run: cargo doc --locked --all-features --no-deps

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 --config .markdownlint.json "**/*.md" "!target"

      - name: Install cargo-insta
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2
        with:
          tool: cargo-insta@1.48.0

      - name: Check snapshots
        run: cargo insta test --all-features --unreferenced reject -- -q

      - name: Install cargo-audit
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Audit dependencies
        run: cargo audit --deny warnings

      - name: Verify package
        run: cargo publish --locked --dry-run

  publish:
    name: Publish treetop-core
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Check whether this version is already published
        id: published
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "treetop-core") | .version')"
          if ! status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --retry 3 \
            --retry-all-errors \
            --retry-max-time 60 \
            --connect-timeout 10 \
            --max-time 30 \
            --header 'User-Agent: treetop-core release workflow (github.com/treetop-policy-engine/treetop-core)' \
            "https://crates.io/api/v1/crates/treetop-core/${version}")"; then
            echo "Could not determine whether treetop-core ${version} is published." >&2
            exit 1
          fi

          case "${status}" in
            200)
              echo "published=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "published=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unexpected crates.io response ${status}; refusing to publish." >&2
              exit 1
              ;;
          esac

      - name: Authenticate to crates.io
        if: steps.published.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish treetop-core
        if: steps.published.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Report existing release
        if: steps.published.outputs.published == 'true'
        run: echo "treetop-core ${GITHUB_REF_NAME#v} is already published; nothing to do."
