name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  quality:
    name: Format, lint, test, and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run default-feature tests
        run: cargo test --locked

      - name: Run all-feature tests
        run: cargo test --locked --all-features

      - name: Exercise 10k-policy scale corpus
        env:
          TREETOP_SCALE_POLICY_COUNT: "10000"
        run: >-
          cargo test --locked --all-features --test policy_scale
          configured_policy_scale_loads_evaluates_lists_and_reloads
          -- --ignored --exact --nocapture

      - name: Build documentation
        run: cargo doc --locked --all-features --no-deps

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.2 --config .markdownlint.json "**/*.md" "!target"

      - name: Install cargo-insta
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-insta@1.49.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.23.0

      - name: Audit dependencies
        run: cargo audit --deny warnings

      - name: Check snapshots
        run: cargo insta test --all-features --unreferenced reject -- -q

      - name: Verify package
        run: cargo package --locked

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.93.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check MSRV
        run: cargo check --locked --all-features --lib
